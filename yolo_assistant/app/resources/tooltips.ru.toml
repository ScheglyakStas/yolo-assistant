"""
refresh = """
Снова ищет камеры, открывая их по очереди. Используйте после подключения камеры
или после закрытия другого приложения, которое её занимало.
"""

[demo]
epochs = "Сколько эпох должна пройти имитация запуска. Модель не обучается; так проверяются механизмы самого приложения."
batches_per_epoch = "Число имитируемых пакетов за эпоху. Чем больше значение, тем чаще приходят обновления, а именно это нагружает отображение."
epoch_seconds = "Сколько секунд должна длиться каждая имитируемая эпоха."
ignore_cancel = """
Заставляет имитируемый рабочий процесс игнорировать вежливую просьбу
