# Пояснения, которые появляются при наведении указателя мыши на любой параметр
# приложения.
# Русский перевод tooltips.toml — должен содержать ровно те же ключи.
#
# Написано для человека, который обучает свою первую модель: объясняйте, что
# делает настройка и что будет, если задать её неправильно, а не как называется
# аргумент.
#
# Элемент управления, ключа которого здесь нет, вызывает ошибку при создании.
# Так сделано намеренно.

[system]
backend = """
Какую CUDA-сборку PyTorch установить. «Автоматически» выбирает самую новую
сборку, которую поддерживает ваш драйвер, и это почти всегда правильный выбор.
Выбирайте вручную, только если автоматический выбор пал на сборку, которую ваша
видеокарта не может запустить.
"""
check_updates = """
Проверяет, вышла ли более новая версия Ultralytics, и до установки показывает,
что именно изменится. Обновление может потянуть за собой другую сборку PyTorch,
поэтому сначала показывается план. Кроме того, приложение тихо проверяет
обновления один раз при каждом запуске.
"""

setup = """
Создаёт отдельное окружение Python, которое приложение использует для обучения,
со сборкой PyTorch, подобранной под ваш драйвер видеокарты. Ничего не
устанавливается в систему, и ваш собственный Python не затрагивается. При первом
запуске скачивается несколько гигабайт.
"""
rebuild = """
Удаляет это окружение и собирает его заново с нуля. Используйте, если настройка
была прервана или окружение перестало работать. Это безопасно: ваши наборы
данных и обученные модели не затрагиваются.
"""

[dataset]
source_folder = """
Папка с вашими фотографиями, в которой для каждого класса есть своя подпапка.
Названия подпапок становятся названиями классов. Исходные файлы никогда не
изменяются: приложение работает с копией.
"""

project_folder = """
Куда записывается подготовленный набор данных. Исходные фото копируются сюда, а
не перемещаются, поэтому здесь нужно место для второй копии ваших фотографий.
Выберите диск со свободным местом: всё, что создают следующие шаги, тоже
хранится здесь.
"""
val_split = """
Доля фото каждого класса, которая откладывается для проверки точности на
фотографиях, на которых модель не обучалась. Без отложенной части показанная
точность ничего не значит. Разделение фиксируется сейчас и используется всеми
запусками обучения, поэтому их можно сравнивать между собой. Обычно берут 20%.
"""
prepare = """
Копирует фото в папку проекта, переименовывает их, проверяет, что каждое
открывается, и записывает файлы, которые нужны YOLO. В исходной папке ничего не
меняется. О повреждённых фото и дубликатах сообщается, и они не включаются.
"""
open_folder = """
Открывает папку проекта в файловом менеджере, чтобы вы могли посмотреть
подготовленный набор данных, разметку, а позже и обученные модели.
"""

[autolabel]
prompt = """
Короткое описание объекта, который нужно найти на фото этого класса, простыми
словами на английском — «a red apple», «a delivery van». OWLv2 ищет то, что вы
описали, поэтому будьте достаточно точны, чтобы исключить похожие объекты
на фоне. Разные варианты формулировки разделяйте точкой с запятой:
«a lorry; a truck».
"""
threshold = """
Насколько уверенной должна быть OWLv2, чтобы нарисовать рамку. Ниже — находит
больше объектов, но и больше выдумывает; выше — чище, но кое-что пропускает.
Оценки уверенности у OWLv2 невысокие, поэтому разумно начать с 0,15–0,25.
"""
max_detections = """
Максимальное число рамок на одном фото. Если на каждом фото ровно один объект,
значение 1 убирает целый вид ошибок — повторяющиеся рамки.
"""
model = """
Какой моделью OWLv2 размечать. Базовая модель — быстрая, с неё и стоит начать;
большая находит более сложные объекты, но работает примерно в три раза дольше.
Обе помещаются на вашу видеокарту — сколько фото обрабатывается за раз,
рассчитывается по реально свободной памяти. Каждая модель скачивается один раз,
при первом использовании.
"""
relabel = """
Размечает все фото заново, заменяя уже существующую разметку — в том числе ту,
которую вы исправили вручную на шаге 4. Если выключить, размечаются только фото
без разметки; так же продолжается и отменённый запуск.
"""
start = """
Прогоняет OWLv2 по всем фото, у которых ещё нет разметки, и записывает по одному
файлу разметки на каждое фото. Остановить можно в любой момент и продолжить
позже; уже обработанные фото не повторяются. Ничего никуда не отправляется —
модель работает на вашей собственной видеокарте.
"""

[verify]
classes = """
Классы вашего набора данных. Выберите один, чтобы пролистать его фото. Если в
классе на большинстве фото ничего не найдено, значит, описание не подошло —
исправьте формулировку на шаге 3 и разметьте этот класс заново.
"""
navigation = """
Переходит к следующему или предыдущему фото в этом классе. Клавиши со стрелками
влево и вправо и колесо мыши делают то же самое — так быстрее просматривать,
если фото больше нескольких.
"""
only_empty = """
Показывает только фото, на которых модель вообще ничего не нашла. Их стоит
проверить в первую очередь: фото без рамок учит модель тому, что её объекта там
нет, поэтому класс, полный таких фото, — это описание, которое не сработало.
"""
delete_box = """
Удаляет выбранную рамку. Щёлкните по рамке на фото, чтобы выбрать её, или
нажмите клавишу Delete. Фото без рамок означает «здесь ничего нет», и это
вполне правильная разметка для фото, которое действительно пустое.
"""
revert = """
Возвращает разметку этого фото к тому виду, какой она была, когда вы его
открыли, отменяя добавленные или удалённые рамки. Действует только на это фото
и только до перехода к другому.
"""

[train]
model = """
Начальная контрольная точка. Маленькие модели (n, s) быстрее обучаются и быстрее
работают на скромном оборудовании; большие (l, x) точнее, но им нужно больше
памяти GPU и времени. Начните с n или s, чтобы пройти весь процесс целиком, а
потом переходите к большим. Каждая модель скачивается один раз, при первом
использовании.
"""
output_name = """
Название этого запуска обучения. Результаты записываются в папку с таким именем
внутри проекта, поэтому выберите название, которое вы потом узнаете. Если под
этим именем уже есть обученная модель, она заменяется только с вашего согласия.
"""
epochs = """
Сколько раз модель просматривает весь набор данных. Слишком мало — она не
успеет научиться; слишком много — начнёт запоминать ваши фото вместо того, чтобы
обобщать. Для нескольких сотен фото разумно взять 100. Обучение можно
остановить раньше и сохранить лучшую эпоху, так что ошибка в большую сторону
стоит только времени.
"""
quantize = """
Обучение с учётом квантования: модель обучается так, чтобы оставаться точной
после сжатия до 8-битных целых чисел, что намного быстрее на периферийных
устройствах. Не включайте, если только вы не развёртываете модель на
устройстве, которому нужен INT8, — квантование при экспорте проще и обычно лишь
немного снижает точность. Модель, обученную так, нужно экспортировать в INT8.
"""
imgsz = """
Сторона квадрата в пикселях, к которому приводятся фото при обучении. Должна
быть кратна 32. Больший размер лучше видит мелкие объекты, но требует гораздо
больше памяти GPU и времени. Ultralytics всегда обучает на квадратах; форма, в
которой модель будет работать, например 16:9, выбирается при экспорте на шаге 6.
"""
val_split = """
Доля фото, которая откладывается для проверки точности на фотографиях, на
которых модель не обучалась. Без отложенной части показанная точность ничего не
значит. Она фиксируется при подготовке набора данных на шаге 2, чтобы два
запуска можно было сравнивать.
"""
additional_args = """
Дополнительные настройки Ultralytics в виде пар через запятую, например
«batch=8, patience=20». Названия, которых Ultralytics не знает, отклоняются до
начала запуска. Моделью, набором данных, устройством, размером изображения,
числом эпох и папкой результатов управляет приложение, и задать их здесь нельзя.
"""
start = """
Начинает обучение и записывает результаты в папку запусков проекта. Это может
занять несколько часов; остановить можно в любой момент, и лучшая на тот момент
эпоха сохранится как рабочая модель. Ничего не покидает этот компьютер.
"""
runs = """
Запуски обучения, которые уже есть в этом проекте. Если хотя бы у одного из них
есть сохранённая модель, на шаг 6 можно перейти, ничего сейчас не обучая —
результаты сохраняются и не перезаписываются, если только вы не используете то
же имя повторно.
"""

[export]
model = """
Какую обученную контрольную точку преобразовать. «Лучшая эпоха» — это эпоха с
самым высоким результатом на фото, отложенных при обучении; «последняя эпоха» —
та, на которой запуск остановился. Если запуск рано достиг пика, а потом
переобучился, это разные модели, и почти всегда вам нужна лучшая.
"""
format = """
Формат для развёртывания. ONNX работает почти везде; TensorRT быстрее всего на
оборудовании NVIDIA, но файл работает только на той видеокарте и с тем
драйвером, где он был собран. Модель, обученную с INT8 QAT, можно экспортировать
только в ONNX или TensorRT.
"""
quantize = """
Точность чисел в экспортированной модели. INT8 — самая маленькая и быстрая,
FP16 — хороший баланс, FP32 — самая точная и самая большая. Модель, обученную с
INT8 QAT, нужно экспортировать в INT8.
"""
imgsz = """
Размер входа, который ожидает экспортированная модель, в пикселях: высота и
ширина. Оба значения должны быть кратны 32 и не больше размера, использованного
при обучении. По умолчанию — 16:9 при размере обучения, например 1024x576 для
модели, обученной на 1024. Подберите пропорции под фото, видео или камеру, с
которыми модель будет работать: вход другой формы дополняется пустыми полями, и
на каждом кадре тратится лишнее время.
"""
deepstream = """
Добавляет настройки, которых ожидает NVIDIA DeepStream, чтобы экспортированный
файл можно было сразу вставить в конвейер DeepStream. Для любой другой целевой
платформы выключите этот параметр.
"""
additional_args = """
Дополнительные настройки экспорта в виде пар через запятую, например
«dynamic=true». Неизвестные названия отклоняются до начала экспорта. Моделью,
устройством, упрощением графа и версией opset ONNX управляет приложение.
"""
start = """
Преобразует выбранную контрольную точку и записывает результат в папку экспорта
проекта под именем, по которому видно, из какого запуска, какой эпохи и с какой
точностью он получен. Для ONNX это секунды; движок TensorRT собирается минутами
и во время сборки ничего не сообщает.
"""
exports = """
Файлы, уже экспортированные из этого проекта. Одного из них достаточно, чтобы
перейти к шагу 7, ничего сейчас не экспортируя. Открывает папку экспорта в
файловом менеджере.
"""

[test]
model = """
Какой экспортированный файл запустить. Предлагается каждый файл из папки
экспорта проекта с указанием формата и точности, в которых он сделан. Движок
TensorRT работает только на том компьютере и с тем драйвером, где он собран.
"""
device = """
Где запускать модель. На GPU намного быстрее; CPU показывает, чего ждать на
оборудовании без видеокарты NVIDIA. Сравнив их, вы поймёте, нужен ли GPU при
развёртывании.
"""
mode = """
«Фото» — модель запускается один раз на неподвижном изображении. «Видео» —
модель обрабатывает файл кадр за кадром. «Камера» — модель работает в реальном
времени на подключённой камере.
"""
camera = """
С какой подключённой камеры читать. Камеры, которые уже заняты другим
приложением, не появятся, потому что большинство драйверов отдают камеру только
одной программе за раз. Подключив камеру, нажмите «Обновить».
"""
camera_mode = """
Какой размер картинки и частоту кадров запросить у камеры. Камера без точно
такого размера выберет ближайший, а в журнале будет сказано, что она выдала.
Частота кадров ограничивает, сколько кадров в секунду получает модель, даже если
драйвер её не соблюдает.
"""
source = """
Фото или видео, на котором запускается модель. В него ничего не записывается.
Копия с нарисованными рамками сохраняется во временную папку проекта — копия
видео воспроизводится с исходной скоростью, когда обработаны все кадры. Эта
копия удаляется, когда вы выбираете другой файл или закрываете приложение;
чтобы сохранить её, используйте «Сохранить как...».
"""
confidence = """
Насколько модель должна быть уверена, чтобы нарисовать рамку, — от 0,01 до 0,95.
Чем ниже, тем больше рамок, в том числе сомнительных: так можно выяснить, видит
ли модель объект вообще. Тестируйте при том значении, с которым собираетесь
развёртывать модель.
"""
start = """
Запускает выбранный файл. Фото обрабатывается за мгновение, видео — до конца, а
камера работает, пока вы не нажмёте «Остановить». Подготовка модели в первый раз
занимает несколько секунд, и это время показывается отдельно от времени на кадр.
"""
save = """
Сохраняет фото или видео с нарисованными рамками. Копия, которую показывает
приложение, временная и удаляется, когда вы выбираете другой файл или
закрываете приложение; файл, сохранённый здесь в любое место вне временной
